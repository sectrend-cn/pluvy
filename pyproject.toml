[build-system]
requires = ["hatchling>=1.27,<2", "hatch-vcs>=0.4,<1"]
build-backend = "hatchling.build"

[project]
name = "pluvy"
dynamic = ["version"]
description = "Read-only, parser-backed engineering policy gate for Python, Go, Java, JavaScript and TypeScript"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["static-analysis", "policy", "tree-sitter", "code-review", "engineering-standards"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
]
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.10,<3",
  "tree-sitter>=0.25,<0.26",
  "tree-sitter-python>=0.25,<0.26",
  "tree-sitter-go>=0.25,<0.26",
  "tree-sitter-javascript>=0.25,<0.26",
  "tree-sitter-typescript>=0.23,<0.24",
  "agent-client-protocol>=0.12.1,<0.13",
  "mcp>=1.26,<2",
  "tree-sitter-java>=0.23,<0.24",
]

[project.scripts]
pluvy = "pluvy.cli:main"

[project.urls]
Homepage = "https://sectrend-cn.github.io/pluvy/"
Repository = "https://github.com/sectrend-cn/pluvy"
Documentation = "https://github.com/sectrend-cn/pluvy/blob/main/docs/getting-started.md"
Issues = "https://github.com/sectrend-cn/pluvy/issues"

[tool.hatch.version]
source = "vcs"
fallback-version = "0.0.0.dev0"

[tool.hatch.build.targets.wheel]
packages = ["src/pluvy"]

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/docs",
  "/examples",
  "/.agents/skills/pluvy",
  "/.pluvy",
  "/.github",
  "/README.md",
  "/AGENTS.md",
  "/LICENSE",
  "/Dockerfile",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.12,<1", "mypy>=1.15,<2"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "ANN", "B"]

[tool.mypy]
python_version = "3.12"
strict = true

[[tool.mypy.overrides]]
module = ["tree_sitter_python", "tree_sitter_go", "tree_sitter_javascript", "tree_sitter_typescript"]
ignore_missing_imports = true
