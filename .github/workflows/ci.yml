name: CI

on:
  push:
    branches:
      - "**"
    paths-ignore:
      - "website/**"
      - ".github/workflows/deploy-website.yml"
  pull_request:
    paths-ignore:
      - "website/**"
      - ".github/workflows/deploy-website.yml"

permissions:
  contents: read

jobs:
  engineering:
    name: Engineering checks
    uses: ./.github/workflows/engineering.yml
